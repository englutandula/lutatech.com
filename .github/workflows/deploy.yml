name: Full Automated CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Start with Python in AWS
  deploy-aws:
    name: 🐍 Deploy Python to AWS
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: 🚀 Sync & Redeploy on AWS EC2
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude 'out' \
            --exclude 'laravel-backend' \
            --exclude 'frontend' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ ubuntu@$EC2_HOST:/home/ubuntu/luta-studio/

          ssh -i ~/.ssh/id_rsa ubuntu@$EC2_HOST "cd /home/ubuntu/luta-studio && docker compose up -d --build"

      - name: 🩺 Run Health Check
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 3 http://$EC2_HOST:8000/api/health || exit 1

  # 2. Deploy Frontend to Namecheap
  deploy-frontend:
    name: 🌐 Deploy Frontend to Namecheap
    runs-on: ubuntu-latest
    needs: deploy-aws # <--- Starts only AFTER AWS finishes

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: ⚙️ Build Static Export
        working-directory: frontend
        env:
          NEXT_PUBLIC_SITE_URL: https://lutatech.com
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://51.20.42.164:8000/api' }}
        run: npm run build

      - name: 🚀 Upload Frontend to cPanel (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: ./public_html/
          dangerous-clean-slate: false

  # 3. Deploy Laravel to Namecheap
  deploy-laravel:
    name: 🐘 Deploy Laravel to Namecheap
    runs-on: ubuntu-latest
    needs: deploy-aws # <--- Starts only AFTER AWS finishes

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl
          tools: composer:v2

      - name: 📦 Install Composer Dependencies
        working-directory: laravel-backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🚀 Upload Laravel Core to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          local-dir: ./laravel-backend/
          server-dir: ./laravel-backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/*
            .env.example
          dangerous-clean-slate: false

      - name: 🚀 Upload Laravel Public Assets to cPanel (public_html/api)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          password: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
          local-dir: ./laravel-backend/public/
          server-dir: ./public_html/api/
          dangerous-clean-slate: false

      - name: ⚡ Execute Remote Migrations
        if: "${{ secrets.NAMECHEAP_SSH_HOST != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAMECHEAP_SSH_HOST }}
          username: ${{ secrets.NAMECHEAP_SSH_USER }}
          password: ${{ secrets.NAMECHEAP_SSH_PASSWORD }}
          key: ${{ secrets.NAMECHEAP_SSH_KEY }}
          script: |
            cd ~/laravel-backend
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
