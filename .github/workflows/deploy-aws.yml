name: Deploy Python AI Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'shared/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}

      - name: 🔐 Add Known Hosts
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 30 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Sync & Redeploy on AWS EC2
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude 'out' \
            --exclude 'laravel-backend' \
            --exclude 'frontend' \
            ./ ubuntu@$EC2_HOST:/home/ubuntu/luta-studio/

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$EC2_HOST "cd /home/ubuntu/luta-studio && docker compose up -d --build"

      - name: 🩺 Run Health Check
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST || secrets.AWS_EC2_H0ST }}
        run: |
          sleep 25
          curl --fail --retry 15 --retry-delay 5 --retry-connrefused http://$EC2_HOST:8000/api/v1/health || curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://$EC2_HOST:8000/api/health || exit 1

