services:
  db:
    image: postgres:16-alpine
    container_name: luta-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: luta_studio
      POSTGRES_USER: luta_user
      POSTGRES_PASSWORD: luta_secret_production_2026
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luta_user -d luta_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ai-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luta-python-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PORT=8000

      - DATABASE_URL=postgresql://luta_user:luta_secret_production_2026@db:5432/luta_studio
      - CORS_ORIGINS=https://lutatech.com,https://www.lutatech.com,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
